<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bóveda de Archivos Segura | Expertos Contables RD</title>
    <link rel="icon" type="image/png" href="contables.png">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #010811;
            overflow: hidden;
            color: white;
        }
        .vault-container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #051020 0%, #010811 100%);
        }
        /* Login Layer */
        .vault-login {
            background: rgba(10, 25, 47, 0.9);
            border: 2px solid var(--accent-gold);
            padding: 4rem;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 0 50px rgba(197, 160, 89, 0.2);
            max-width: 500px;
            width: 90%;
            z-index: 100;
            animation: vaultEntrance 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes vaultEntrance {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .vault-icon {
            font-size: 4rem;
            color: var(--accent-gold);
            margin-bottom: 2rem;
            animation: pulse-gold 2s infinite;
        }
        @keyframes pulse-gold {
            0% { filter: drop-shadow(0 0 10px var(--accent-gold)); }
            50% { filter: drop-shadow(0 0 30px var(--accent-gold)); }
            100% { filter: drop-shadow(0 0 10px var(--accent-gold)); }
        }
        /* DATABASE SECTION */
        .vault-db {
            display: none;
            width: 100%;
            height: 100%;
            padding: 2rem 4rem;
            overflow-y: auto;
        }
        .vault-controls {
            display: flex;
            gap: 2rem;
            margin-top: 2rem;
            background: rgba(255,255,255,0.03);
            padding: 1.5rem;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            align-items: center;
        }
        .search-input {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }
        .filter-select {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            padding: 1rem;
            border-radius: 12px;
            color: var(--accent-gold);
        }
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
            padding-bottom: 5rem;
        }
        .file-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .file-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-10px) scale(1.02);
            background: rgba(197, 160, 89, 0.1);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        .file-card i {
            font-size: 3.5rem;
            color: var(--accent-gold);
            margin-bottom: 1.2rem;
            transition: transform 0.3s ease;
        }
        .file-card:hover i {
            transform: scale(1.1);
        }
        .file-name {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-meta {
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-bottom: 1.2rem;
        }

        /* Detail Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            z-index: 1000100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .modal-content {
            background: #0a192f;
            border: 1px solid var(--accent-gold);
            width: 100%;
            max-width: 900px;
            border-radius: 30px;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            overflow: hidden;
            box-shadow: 0 0 100px rgba(197, 160, 89, 0.2);
            animation: modalPop 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes modalPop {
            from { transform: scale(0.9) translateY(50px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        .modal-left {
            padding: 3rem;
            background: rgba(255,255,255,0.02);
            border-right: 1px solid var(--glass-border);
            text-align: center;
        }
        .modal-right {
            padding: 3rem;
            display: flex;
            flex-direction: column;
        }
        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(45deg, var(--accent-gold), #fff);
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }
        .preview-box {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 1.5rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #a8b2d1;
            margin-top: 1.5rem;
            border: 1px dashed var(--glass-border);
            line-height: 1.6;
        }
        .close-modal {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-size: 2rem;
            color: white;
            transition: color 0.3s;
        }
        .close-modal:hover { color: var(--accent-gold); }

        .vault-input {
            width: 100%;
            padding: 1.5rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            color: white;
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: 5px;
        }
        .vault-input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.3);
        }
    </style>
</head>
<body>

    <div class="vault-container">
        <!-- LOGIN SECTION -->
        <div id="vault-login" class="vault-login">
            <i class="fas fa-shield-alt vault-icon"></i>
            <h1 style="color: white; margin-bottom: 1rem;">Bóveda de Seguridad</h1>
            <p style="color: var(--text-gray); margin-bottom: 2rem;">Ingrese el código de acceso maestro para entrar a la base de datos.</p>
            <input type="text" id="vault-pin" class="vault-input" placeholder="Código de Acceso" style="letter-spacing: 2px;">
            <button class="btn-primary" style="width: 100%; padding: 1.5rem; background: #2ecc71; border-color: #27ae60; color: white;" onclick="verifyVault()">Acceder a Base de Datos</button>
            <div id="error-vault" style="color: #ff4d4d; margin-top: 1rem; display: none;">Código incorrecto. Acceso denegado.</div>
            <div style="margin-top: 2rem;">
                <a href="panel-empleados.html" style="color: var(--text-gray); text-decoration: none; font-size: 0.9rem;">
                    <i class="fas fa-arrow-left"></i> Volver al Panel
                </a>
            </div>
        </div>

        <!-- DATABASE SECTION -->
        <div id="vault-db" class="vault-db">
            <div class="header-flex" style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1 class="section-title" style="margin-bottom: 0;">Base de Datos de Archivos</h1>
                    <p id="vault-user-info" style="color: var(--accent-gold);"></p>
                </div>
                <button class="btn-outline-lg" onclick="location.href='panel-empleados.html'">Salir de Bóveda</button>
            </div>

            <div class="vault-controls">
                <input type="text" id="file-search" class="search-input" placeholder="Buscar por nombre de archivo o categoría..." oninput="filterFiles()">
                <select id="category-filter" class="filter-select" onchange="filterFiles()">
                    <option value="all">Todas las Categorías</option>
                    <option value="Auditoría">Auditoría</option>
                    <option value="Impuestos">Impuestos</option>
                    <option value="Nómina">Nómina</option>
                    <option value="Legal">Legal</option>
                    <option value="Finanzas">Finanzas</option>
                </select>
                <div style="color: var(--accent-gold); font-weight: 700;">
                    <span id="file-count">0</span> Archivos Encontrados
                </div>
            </div>

            <div class="file-grid" id="file-db-grid">
                <!-- Archived files will be listed here -->
            </div>
        </div>
    </div>

    <!-- DETAIL MODAL -->
    <div id="file-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-left" id="modal-icon-container">
                <!-- Icon and ID -->
            </div>
            <div class="modal-right">
                <div class="ai-badge">
                    <i class="fas fa-robot"></i> Análisis por IA Expertos Contables
                </div>
                <h2 id="modal-file-name" style="color: var(--accent-gold); margin-bottom: 0.5rem;">Nombre del Archivo</h2>
                <p id="modal-file-meta" style="color: var(--text-gray); font-size: 0.9rem; margin-bottom: 2rem;">Metadata</p>
                
                <h4 style="color: white; margin-bottom: 1rem;">Resumen Inteligente:</h4>
                <div id="modal-ai-summary" class="preview-box">
                    <!-- AI generated summary -->
                </div>

                <div style="margin-top: auto; display: flex; gap: 1rem;">
                    <button class="btn-primary" style="flex: 1;">Descargar Documento</button>
                    <button class="btn-outline-lg" style="flex: 1;">Compartir</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Security Check
        const empID = sessionStorage.getItem('empID');
        if (!empID) window.location.href = 'empleados.html';

        document.getElementById('vault-user-info').innerText = `Gestión de documentos seguros para ID: ${empID}`;

        // Verification Logic
        function verifyVault() {
            const code = document.getElementById('vault-pin').value.trim();
            const error = document.getElementById('error-vault');
            const masterCode = "Ander2627";

            if (code === masterCode) {
                document.getElementById('vault-login').style.display = 'none';
                document.getElementById('vault-db').style.display = 'block';
                initVault();
            } else {
                error.style.display = 'block';
                setTimeout(() => error.style.display = 'none', 3000);
            }
        }

        // Expanded Database with AI Simulation
        let allFiles = [];
        const categories = ["Auditoría", "Impuestos", "Nómina", "Legal", "Finanzas"];
        const fileTypes = ["pdf", "excel", "word", "image"];
        const clients = ["Constructora Valdez", "Restaurante El Sabor", "Tienda Tech Point", "Inversiones ABC", "Grupo Sánchez", "Farmacia Dominicana"];

        function initVault() {
            // Generate 60 realistic files
            for (let i = 1; i <= 60; i++) {
                const cat = categories[i % categories.length];
                const type = fileTypes[i % fileTypes.length];
                const client = clients[i % clients.length];
                const date = `${(i % 28) + 1}/05/2026`;
                
                allFiles.push({
                    id: `DOC-2026-${1000 + i}`,
                    name: `${cat}_${client.replace(/ /g, "_")}_V${i}. ${type === 'image' ? 'png' : (type === 'excel' ? 'xlsx' : (type === 'word' ? 'docx' : 'pdf'))}`,
                    category: cat,
                    type: type,
                    client: client,
                    date: date,
                    size: `${(Math.random() * 5 + 0.5).toFixed(1)} MB`,
                    summary: `Este documento ha sido analizado por nuestra IA. Se trata de un archivo de ${cat.toLowerCase()} correspondiente al cliente ${client}. Contiene registros detallados del periodo fiscal 2026, incluyendo balances generales y proyecciones de cumplimiento. No se detectaron anomalías en la estructura del documento.`
                });
            }
            renderFiles(allFiles);
        }

        function renderFiles(files) {
            const grid = document.getElementById('file-db-grid');
            document.getElementById('file-count').innerText = files.length;
            
            grid.innerHTML = files.map(f => `
                <div class="file-card" onclick="openFileDetail('${f.id}')">
                    <i class="fas ${getIcon(f.type)}"></i>
                    <div class="file-name">${f.name}</div>
                    <div class="file-meta">${f.category} | ${f.date}</div>
                    <div class="file-meta" style="color: var(--accent-gold); font-weight: 700;">${f.size}</div>
                </div>
            `).join('');
        }

        function filterFiles() {
            const searchTerm = document.getElementById('file-search').value.toLowerCase();
            const category = document.getElementById('category-filter').value;
            
            const filtered = allFiles.filter(f => {
                const matchesSearch = f.name.toLowerCase().includes(searchTerm) || f.category.toLowerCase().includes(searchTerm);
                const matchesCategory = category === 'all' || f.category === category;
                return matchesSearch && matchesCategory;
            });
            
            renderFiles(filtered);
        }

        function openFileDetail(fileId) {
            const file = allFiles.find(f => f.id === fileId);
            if (!file) return;

            const modal = document.getElementById('file-modal');
            const iconContainer = document.getElementById('modal-icon-container');
            
            iconContainer.innerHTML = `
                <i class="fas ${getIcon(file.type)}" style="font-size: 8rem; color: var(--accent-gold); margin-bottom: 2rem;"></i>
                <div style="color: var(--accent-gold); font-weight: 800; font-size: 1.2rem;">ID: ${file.id}</div>
                <div style="color: var(--text-gray); margin-top: 1rem;">Propiedad de: ${empID}</div>
            `;

            document.getElementById('modal-file-name').innerText = file.name;
            document.getElementById('modal-file-meta').innerText = `Categoría: ${file.category} | Cliente: ${file.client} | Fecha: ${file.date} | Tamaño: ${file.size}`;
            document.getElementById('modal-ai-summary').innerText = file.summary;

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('file-modal').style.display = 'none';
        }

        function getIcon(type) {
            switch(type) {
                case 'pdf': return 'fa-file-pdf';
                case 'excel': return 'fa-file-excel';
                case 'word': return 'fa-file-word';
                case 'image': return 'fa-file-image';
                default: return 'fa-file-alt';
            }
        }

        // Close modal on outside click
        window.onclick = function(event) {
            const modal = document.getElementById('file-modal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
